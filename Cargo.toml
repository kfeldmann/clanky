[workspace]
resolver = "3"
members = ["crates/clanky", "crates/clanky-protocol", "crates/clanky-provider-deepinfra"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kfeldmann/clanky"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
