[package]
name = "clanky"
description = "An AI coding agent for the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
clanky-protocol = { path = "../clanky-protocol" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
serde_json = "1"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2.0"
wait-timeout = "0.2"

# Process-group signalling without `unsafe` and without shelling out to
# `kill(1)`: rustix wraps the raw `kill(-pgid, sig)` syscall, keeping the
# `unsafe` inside its own crate (workspace lints forbid it here). Already in
# the tree via crossterm -> rustix; `process` is the only extra feature.
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", default-features = false, features = ["std", "process"] }

[lints]
workspace = true

[dev-dependencies]
base64 = "0.22"
